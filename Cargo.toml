[package]
name = "omui"
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
# The code is MIT; the bundled icons are Lucide's (THIRD_PARTY_NOTICES.md).
license = "MIT AND ISC"
description = "The shared look and widgets of a family of Omarchy desktop apps: GTK 4, themed live from Omarchy, no libadwaita"
repository = "https://github.com/ferdousbhai/omui"

[features]
# `dev::shot`, for screenshot hooks in debug builds.
dev = []
# Scripted QA (`OMUI_QA=1`, dev/qa.sh): commands on stdin, answers on `OMUI_QA_FD`. Off by default, so a release build
# carries none of it.
qa = ["dev", "dep:serde_json"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# The one dependency beyond gtk4, from the same gtk-rs release: GTK names an application's Wayland windows by its
# dotted GApplication id, and only this crate's `WaylandToplevel` can name them by the app's short name instead.
gdk-wayland = { package = "gdk4-wayland", version = "0.11" }
serde_json = { version = "1", optional = true }

[build-dependencies]
glib-build-tools = "0.22"

